name: NFTMaps
options:
  bundleIdPrefix: com.hackbuilder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  swift-secp256k1:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    exactVersion: 0.25.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.30.0
targets:
  NFTMaps:
    type: application
    platform: iOS
    sources: [NFTMaps]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: NFTMaps/Info.plist
      properties:
        UIBackgroundModes: [location]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PimlicoAPIKey: $(PIMLICO_API_KEY)
        PimlicoPolicyID: $(PIMLICO_POLICY_ID)
        NullMapsURL: $(NULLMAPS_URL)
        NullMapsAPIKey: $(NULLMAPS_API_KEY)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - Baloo2-SemiBold.ttf
          - Baloo2-Bold.ttf
          - Baloo2-ExtraBold.ttf
          - BeVietnamPro-Regular.ttf
          - BeVietnamPro-Medium.ttf
          - BeVietnamPro-SemiBold.ttf
          - BeVietnamPro-Bold.ttf
          - BeVietnamPro-ExtraBold.ttf
    dependencies:
      - package: swift-secp256k1
        product: P256K
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackbuilder.nftmaps
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: NFT Maps
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "NFT Maps dùng vị trí để hiện bạn trên bản đồ và mint NFT tại chỗ bạn đứng."
        INFOPLIST_KEY_NSCameraUsageDescription: "NFT Maps dùng camera để chụp chó/mèo bạn gặp và mint thành NFT."
        INFOPLIST_KEY_NSMotionUsageDescription: "NFT Maps đếm bước chân khi bạn chạy và cho nhiệm vụ bước chân mỗi ngày."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "NFT Maps dùng ảnh bạn chọn để chơi màn bắt, nhận bé hoặc báo bé cần giúp."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "NFT Maps gọi NullMaps chạy trên máy Mac trong mạng nhà để dẫn đường."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  NFTMapsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NFTMapsTests]
    dependencies:
      - target: NFTMaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackbuilder.nftmaps.tests
        GENERATE_INFOPLIST_FILE: YES
  NFTMapsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NFTMapsUITests]
    dependencies:
      - target: NFTMaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackbuilder.nftmaps.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NFTMaps
schemes:
  NFTMaps:
    build:
      targets:
        NFTMaps: all
        NFTMapsTests: [test]
        NFTMapsUITests: [test]
    test:
      targets: [NFTMapsTests, NFTMapsUITests]
